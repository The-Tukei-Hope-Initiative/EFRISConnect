<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" role="img" aria-label="Tills reach Manager and URA only through the EFRISConnect relay" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="760" height="328" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">Tills reach Manager and URA only through the EFRISConnect relay</text>

  <rect x="24" y="104" width="160" height="88" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
  <text x="40" y="128" font-weight="600" fill="#1f2328">Tills and laptops</text>
  <text x="40" y="148" font-size="11.5" fill="#57606a">Browser only</text>
  <text x="40" y="164" font-size="11.5" fill="#57606a">Trust the server</text>
  <text x="40" y="180" font-size="11.5" fill="#57606a">certificate once</text>

  <rect x="232" y="64" width="288" height="240" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1"/>
  <text x="248" y="88" font-weight="600" fill="#1f2328">Shop server PC</text>

  <rect x="248" y="104" width="256" height="88" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="264" y="128" font-weight="600" fill="#1f2328">EFRISConnect relay</text>
  <text x="264" y="148" font-size="11.5" fill="#1f2328">https :5443 extension and API</text>
  <text x="264" y="164" font-size="11.5" fill="#1f2328">https :5001 Manager for tills</text>
  <text x="264" y="180" font-size="11.5" fill="#1f2328">Vault, offline queue, logs</text>

  <rect x="248" y="216" width="256" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
  <text x="264" y="240" font-weight="600" fill="#1f2328">Manager Server</text>
  <text x="264" y="260" font-size="11.5" fill="#57606a">127.0.0.1:5000 only</text>
  <text x="264" y="276" font-size="11.5" fill="#57606a">Data in C:\ProgramData\Manager.io</text>

  <rect x="568" y="104" width="168" height="88" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
  <text x="584" y="128" font-weight="600" fill="#1f2328">URA EFRIS</text>
  <text x="584" y="148" font-size="11.5" fill="#57606a">T109 T110 T130 T131</text>
  <text x="584" y="164" font-size="11.5" fill="#57606a">Sales queue when</text>
  <text x="584" y="180" font-size="11.5" fill="#57606a">it is unreachable</text>

  <g fill="none" stroke="#8c959f" stroke-width="1.25">
    <path d="M184 148H246" marker-end="url(#arch-arrow)"/>
    <path d="M504 148H566" marker-end="url(#arch-arrow)"/>
    <path d="M376 192V214" marker-end="url(#arch-arrow)"/>
  </g>
  <text x="216" y="138" text-anchor="middle" font-size="11.5" fill="#57606a">https</text>
  <text x="536" y="138" text-anchor="middle" font-size="11.5" fill="#57606a">API</text>
  <text x="384" y="208" font-size="11.5" fill="#57606a">API and proxy</text>
</svg>
