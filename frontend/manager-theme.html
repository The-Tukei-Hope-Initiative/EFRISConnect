<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Document</title>
<!-- EFRISConnect theme for Manager documents (receipts, invoices, credit notes).
     Same Classic fiscal layout as the extension's receipt.html. The relay injects
     the offline QR encoder and this business's document settings at the markers
     below when the theme is installed or copied. -->
<style>
:root {
  --band: #1f2937; --rule: #111111; --hair: #d1d5db; --muted: #333333; --ui: #14532d;
  --doc: Arial, Helvetica, 'Liberation Sans', sans-serif;
  --docmono: 'Courier New', Courier, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #e5e7eb; font-family: var(--doc); color: #000; font-variant-numeric: tabular-nums; }
a { color: inherit; }

/* toolbar (hidden on the printout) */
#tc { max-width: 816px; margin: 12px auto 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; background: #fff; border: 1px solid var(--hair); border-radius: 10px; padding: 8px 12px; font: 13px 'Segoe UI', system-ui, sans-serif; }
#tc .grp { display: flex; border: 1px solid #9ca3af; border-radius: 8px; overflow: hidden; }
#tc .grp button { min-height: 34px; padding: 0 10px; border: 0; border-right: 1px solid var(--hair); background: #fff; font: 600 12.5px 'Segoe UI', system-ui, sans-serif; cursor: pointer; }
#tc .grp button:last-child { border-right: 0; }
#tc .grp button.on { background: var(--ui); color: #fff; }
#tc .pr { min-height: 34px; padding: 0 16px; border-radius: 8px; border: 0; background: var(--ui); color: #fff; font: 700 13px 'Segoe UI', system-ui, sans-serif; cursor: pointer; }
#tc .hint { font-size: 11.5px; color: #4b5563; }

/* sheet */
#stage { padding: 16px 0 50px; }
#sheet { width: 794px; margin: 0 auto; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.18); position: relative; overflow: hidden; }
#sheet.page { padding: 40px 44px 28px; display: flex; flex-direction: column; gap: 14px; }
.hd { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding-bottom: 12px; border-bottom: 3px double var(--rule); }
.hd-left { display: flex; gap: 14px; align-items: center; min-width: 0; }
.hd-logo { width: 68px; height: 68px; object-fit: contain; flex-shrink: 0; }
.hd-name { font-size: 22px; font-weight: 700; letter-spacing: -.2px; line-height: 1.15; }
.hd-lines { font-size: 11.5px; margin-top: 3px; line-height: 1.5; white-space: pre-line; }
.hd-right { text-align: right; }
.hd-title { font-size: 21px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
.hd-sub { font-size: 11.5px; margin-top: 2px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.box { border: 1px solid var(--rule); break-inside: avoid; page-break-inside: avoid; }
.box-h { background: var(--band); color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; padding: 4px 10px; text-transform: uppercase; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.kv { display: grid; grid-template-columns: 134px minmax(0, 1fr); padding: 4px 10px 6px; font-size: 12px; line-height: 1.35; }
.kv .k, .kv .v { padding: 4px 0; border-bottom: 1px solid #e5e7eb; }
.kv .k { padding-right: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv .k:nth-last-child(2), .kv .v:last-child { border-bottom: 0; }
.kv .v { overflow-wrap: anywhere; white-space: pre-line; }
.kv .v.strong { font-weight: 700; }
.notice { padding: 8px 10px; font-size: 12px; }
.desc { font-size: 12px; font-style: italic; padding: 6px 10px 0; }
table.items { width: 100%; border-collapse: collapse; font-size: 12px; }
table.items thead th { vertical-align: bottom; text-align: left; font-size: 10.5px; font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
table.items td { line-height: 1.35; padding: 7px 8px; border-bottom: 1px solid var(--hair); vertical-align: top; }
table.items tr { break-inside: avoid; page-break-inside: avoid; }
table.items tbody tr:last-child td { border-bottom: 0; }
table.items .r { text-align: right; white-space: nowrap; }
table.items .c { text-align: center; }
table.items td:first-child { font-weight: 600; }
table.items tr.group td { font-weight: 700; background: #f3f4f6; }
table.items tr.total td { font-weight: 700; border-top: 1px solid var(--rule); }
.it-sub { font-size: 10.5px; font-weight: 400; color: var(--muted); margin-top: 1px; }
.lower { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 12px; align-items: start; }
.sum { padding: 8px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.sum .ln { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sum .ln span:last-child { text-align: right; white-space: nowrap; }
.sum .gross { font-size: 15px; font-weight: 700; border-top: 1px solid var(--rule); padding-top: 5px; margin-top: 2px; }
.sum .gross:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.status { display: inline-block; margin: 8px 10px; padding: 3px 12px; border: 1.5px solid var(--rule); border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.verify { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 12px; border: 1px solid var(--rule); break-inside: avoid; page-break-inside: avoid; }
.qr img { width: 118px; height: 118px; image-rendering: pixelated; display: block; }
.verify .vt { font-size: 12px; line-height: 1.5; }
.verify .vh { font-weight: 700; letter-spacing: 1px; margin-bottom: 2px; }
.msg { font-size: 12px; white-space: pre-line; border-top: 1px solid var(--hair); padding-top: 8px; }
.footers { font-size: 12px; border-top: 1px solid var(--hair); padding-top: 8px; }
.sigs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; padding-top: 22px; font-size: 11.5px; break-inside: avoid; }
.sigs div { border-top: 1px solid var(--rule); padding-top: 4px; }
.end { display: flex; justify-content: flex-end; font-size: 10.5px; color: var(--muted); border-top: 1px solid var(--hair); padding-top: 8px; }
.err { max-width: 560px; margin: 40px auto; background: #fff; border: 1px solid var(--hair); border-radius: 10px; padding: 18px; font: 14px 'Segoe UI', system-ui, sans-serif; }

/* A5 / A6: same layout, tighter */
#sheet.a5 { padding: 28px 28px 20px; gap: 11px; }
#sheet.a5 .hd { padding-bottom: 8px; } #sheet.a5 .hd-logo { width: 52px; height: 52px; }
#sheet.a5 .hd-name { font-size: 18px; } #sheet.a5 .hd-title { font-size: 16px; }
#sheet.a5 .box-h { padding: 3px 8px; font-size: 9.5px; }
#sheet.a5 .kv { grid-template-columns: 106px minmax(0, 1fr); padding: 2px 8px 4px; font-size: 11px; line-height: 1.3; }
#sheet.a5 .kv .k, #sheet.a5 .kv .v { padding: 2px 0; }
#sheet.a5 .kv .v.code { font-size: 10px; white-space: nowrap; }
#sheet.a5 table.items, #sheet.a5 .sum { font-size: 11px; }
#sheet.a5 table.items th, #sheet.a5 table.items td { padding: 4px 6px; }
#sheet.a5 .lower { grid-template-columns: minmax(0, 1fr) 194px; }
#sheet.a5 .sum { padding: 6px 8px; gap: 2px; } #sheet.a5 .sum .gross { font-size: 12px; }
#sheet.a5 .verify { padding: 8px; gap: 12px; } #sheet.a5 .verify .vt { font-size: 10.5px; }
#sheet.a5 .qr img { width: 84px; height: 84px; }
#sheet.a6 { padding: 16px 16px 14px; gap: 9px; }
#sheet.a6 .hd { grid-template-columns: 1fr; } #sheet.a6 .hd-right { text-align: left; }
#sheet.a6 .hd-logo { width: 44px; height: 44px; }
#sheet.a6 .hd-name { font-size: 15px; } #sheet.a6 .hd-title { font-size: 14px; letter-spacing: 1px; }
#sheet.a6 .grid2, #sheet.a6 .lower { grid-template-columns: 1fr; gap: 8px; }
#sheet.a6 .kv { grid-template-columns: 1fr; font-size: 10.5px; }
#sheet.a6 .kv .k { border-bottom: 0; padding-bottom: 0; }
#sheet.a6 table.items, #sheet.a6 .sum { font-size: 10.5px; }
#sheet.a6 table.items td, #sheet.a6 table.items th { padding: 5px 4px; }
#sheet.a6 .verify { grid-template-columns: 1fr; justify-items: center; text-align: center; }

/* thermal slip (80mm / 58mm) */
#sheet.slip { width: 302px; padding: 14px 12px 18px; font-family: var(--docmono); font-size: 11.5px; line-height: 1.45; display: flex; flex-direction: column; gap: 8px; }
#sheet.slip.w58 { width: 219px; padding: 10px 8px 14px; font-size: 10.5px; }
.sl-c { text-align: center; } .sl-b { font-weight: 700; } .sl-big { font-size: 14px; font-weight: 700; }
.sl-row { display: flex; justify-content: space-between; gap: 6px; }
.sl-row > span:last-child { text-align: right; white-space: nowrap; }
.sl-dash { border-top: 1px dashed #000; }
.sl-band { border-top: 1.5px solid #000; border-bottom: 1.5px solid #000; padding: 3px 0; }
.sl-wrap { overflow-wrap: anywhere; }
.sl-qr { display: flex; justify-content: center; }
.sl-qr img { width: 150px; height: 150px; image-rendering: pixelated; }
#sheet.slip.w58 .sl-qr img { width: 130px; height: 130px; }

@media print {
  body { background: #fff; }
  #tc { display: none !important; }
  #stage { padding: 0; }
  #sheet { box-shadow: none; margin: 0; }
}
</style>
<style id="pageCss"></style>
</head>
<body>
<div id="tc">
  <div class="grp" id="paperSel" role="group" aria-label="Paper size"></div>
  <span class="hint">Pick the paper, then Print. Choose "Save as PDF" in the print dialog for a PDF.</span>
  <button type="button" class="pr" onclick="window.print()">Print</button>
</div>
<div id="stage"><div id="sheet" class="page"></div></div>
<script>
/*@QRLIB@*/ /* offline QR encoder injected here (inside this script) by the relay */
/*@PREFS@*/ /* this business's document settings (band colour, footer, payment details) */
var PREFS = (typeof EFC_PREFS === 'object' && EFC_PREFS) || {};
var SHOW = PREFS.show || {};
var SELLER = PREFS.seller || {};
var PAPERS = ['A4', 'A5', 'Letter', 'A6', '80mm', '58mm'];
var PAGE_MM = { A4: [210, 297, 10], Letter: [215.9, 279.4, 10], A5: [148, 210, 7], A6: [105, 148, 4] };
var DOC = null, PAPER = 'A4';
if (/^#[0-9a-f]{6}$/i.test(PREFS.band || '')) document.documentElement.style.setProperty('--band', PREFS.band);

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function isUrl(s) { return /^https?:\/\//i.test(String(s || '')); }
function el(id) { return document.getElementById(id); }
function has(f) { return !!(f && String(f.text || '').trim()); }
function findField(fields, kw) {
  for (var i = 0; i < (fields || []).length; i++) {
    var f = fields[i], lab = String(f.label || '').toLowerCase(), key = String(f.key || '').toLowerCase();
    if (kw.some(function (k) { return lab.indexOf(k) >= 0 || key.indexOf(k) >= 0; })) return f;
  }
  return null;
}
function box(title, body) { return '<div class="box"><div class="box-h">' + esc(title) + '</div>' + body + '</div>'; }
function kv(rows) {
  return '<div class="kv">' + rows.filter(Boolean).map(function (r) {
    return '<div class="k">' + esc(r[0]) + '</div><div class="v ' + (r[2] || '') + '">' + (r[3] ? r[1] : esc(r[1] == null || r[1] === '' ? '-' : r[1])) + '</div>';
  }).join('') + '</div>';
}
function fieldVal(f) { return (f.link && isUrl(f.link.url)) ? '<a target="_top" href="' + esc(f.link.url) + '">' + esc(f.text || f.link.url) + '</a>' : esc(f.text || ''); }
function qrImg(data) {
  if (!data || typeof qrcode === 'undefined') return '';
  try { var q = qrcode(0, 'M'); q.addData(data); q.make(); return '<img alt="QR code: verify on URA EFRIS" src="' + q.createDataURL(6, 4) + '"/>'; } catch (e) { return ''; }
}
function stamp() { try { return 'Printed ' + new Date().toLocaleString('en-UG', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }

/* Split Manager's view data into the Classic sections. */
function model(d) {
  var biz = d.business || {}, rec = d.recipient || {};
  var seen = {};   // a field on both the customer and the document arrives twice
  var all = (Array.isArray(d.fields) ? d.fields : []).filter(function (f) {
    var k = String(f && f.label || '').trim().toLowerCase() + '|' + String(f && f.text || '').trim();
    if (seen[k]) return false; seen[k] = 1; return true;
  });
  var m = { d: d, biz: biz, rec: rec, used: [] };
  function take(kw) { var f = findField(all.filter(function (x) { return m.used.indexOf(x) < 0; }), kw); if (f) m.used.push(f); return f; }
  m.fdn = take(['fdn', 'fiscal document']); m.ver = take(['verification', 'antifake']); m.qr = take(['qr code', 'qr']);
  m.dev = take(['device']); m.invId = take(['invoice id', 'ugx inv']); m.sub = take(['submission date', 'issued time']);
  m.stat = take(['efris status']); m.served = take(['issued by', 'served by', 'operator', 'salesperson', 'cashier', 'prepared by']);
  m.title = d.title || 'Document';
  m.kind = /credit/i.test(m.title) ? 'credit' : /invoice/i.test(m.title) ? 'invoice' : 'receipt';
  // A debit note is recorded in Manager as a sales invoice: reference DN-... or a
  // "Debit note for ..." description. Print it as a debit note.
  // A receipt that only settles a sales invoice ("Payment for <ref>" lines on
  // Accounts receivable): payments are not sent to URA, the invoice carries the FDN.
  if (m.kind === 'receipt' && !has(m.fdn) && /^payment for /i.test(String((d.table && d.table.description) || ''))) { m.kind = 'payment'; m.title = 'Payment Receipt'; m.hasEfris = false; }
  if (m.kind === 'invoice' && (/^DN-/i.test(String(d.reference || '')) || /^debit note\b/i.test(String((d.table && d.table.description) || '')))) { m.kind = 'debit'; m.title = 'Debit Note'; }
  // Sales documents always get Section B (a "Not fiscalised" notice until submitted);
  // Manager leaves out custom fields that are still empty.
  if (m.hasEfris !== false) m.hasEfris = !!(m.fdn || m.ver || m.qr) || /invoice|receipt|credit/i.test(m.title);
  m.fiscal = has(m.fdn);
  // Buyer fields go to Section C, the rest to the Document box.
  m.buyer = all.filter(function (f) { return m.used.indexOf(f) < 0 && /buyer|customer|tin\b|passport|nationality/i.test(f.label || ''); });
  // Payment fields belong in How to pay, not in the Document box.
  var PAYRX = /^(bank|bank name|account name|account number|account no|mobile money|momo|payment terms)$/i;
  m.payFields = all.filter(function (f) { return m.used.indexOf(f) < 0 && PAYRX.test(String(f.label || '').trim()); });
  m.used = m.used.concat(m.payFields);
  // Leave out fields that only repeat the document number (e.g. "Invoice number").
  var ref = String(d.reference || '').trim();
  m.other = all.filter(function (f) { return m.used.indexOf(f) < 0 && m.buyer.indexOf(f) < 0 && !(ref && String(f.text || '').trim() === ref); });
  var bf = (biz.fields || []).filter(function (f) { return has(f); });
  m.bizTin = findField(bf, ['tin']); m.bizBrn = findField(bf, ['brn', 'registration']);
  m.bizTrade = findField(bf, ['trading as', 'trade name']);
  // Payment fields go to How to pay, not the header.
  m.bizOther = bf.filter(function (f) { return f !== m.bizTin && f !== m.bizBrn && f !== m.bizTrade && !/bank|account|mobile money|momo|payment terms/i.test(f.label || ''); });
  // Manager's Business Details may be empty: fall back to the EFRIS settings.
  if (!m.bizTin && SELLER.tin) m.bizTin = { label: 'TIN', text: SELLER.tin };
  if (!m.bizBrn && SELLER.brn) m.bizBrn = { label: 'BRN', text: SELLER.brn };
  // Trading As in Manager's Business Details wins over the extension's trade name.
  var legal = SELLER.legal || biz.name || d.businessName || '', trade = (m.bizTrade && m.bizTrade.text) || SELLER.trade || '';
  m.name = PREFS.nameMode === 'trade' && trade ? trade : legal;
  var same = function (a, b) { return String(a || '').replace(/\s+/g, ' ').trim().toLowerCase() === String(b || '').replace(/\s+/g, ' ').trim().toLowerCase(); };
  if (PREFS.nameMode === 'trade' && trade) m.name = trade;
  m.name2 = PREFS.nameMode === 'both' && trade && !same(trade, legal) ? legal : '';
  if (PREFS.nameMode === 'both' && trade && !same(trade, legal)) m.name = trade;
  m.legal = legal;
  var lines = [];
  if (biz.address) lines.push(biz.address); else if (SELLER.address) lines.push(SELLER.address);
  var contact = [SELLER.phone, SELLER.email].filter(function (x) { return x && String(biz.address || '').indexOf(x) < 0; });
  if (contact.length) lines.push(contact.join(' · '));
  m.addrLines = lines;
  return m;
}
function cleanBrn(s) { return String(s || '').replace(/^.*\//, '').trim(); }

function renderPage(m) {
  var d = m.d, biz = m.biz, rec = m.rec, h = '';
  var name = m.name;
  h += '<div class="hd"><div class="hd-left">' + (biz.logo ? '<img class="hd-logo" alt="" src="' + esc(biz.logo) + '"/>' : '') +
    '<div><div class="hd-name">' + esc(name) + '</div>' + (m.name2 ? '<div class="hd-lines" style="font-weight:600">' + esc(m.name2) + '</div>' : '') +
    (m.addrLines.length ? '<div class="hd-lines">' + m.addrLines.map(esc).join('<br>') + '</div>' : '') +
    (m.bizOther.length ? '<div class="hd-lines">' + m.bizOther.map(function (f) { return esc(f.label) + ': ' + esc(f.text); }).join(' · ') + '</div>' : '') + '</div></div>' +
    '<div class="hd-right"><div class="hd-title">' + esc(m.title) + '</div>' +
    (m.hasEfris ? '<div class="hd-sub">' + (m.fiscal ? 'Issued under URA EFRIS' : m.kind === 'credit' ? 'Awaiting URA approval' : 'Not fiscalised') + '</div>' : '') + '</div></div>';

  var boxes = [];
  boxes.push(box('Section A · Seller', kv([
    m.bizTin ? ['TIN', m.bizTin.text, 'strong'] : null, m.bizBrn ? ['BRN', cleanBrn(m.bizBrn.text)] : null,
    ['Legal name', m.legal], has(m.dev) ? ['Device no.', m.dev.text] : null,
    (SHOW.servedBy !== false && has(m.served)) ? ['Served by', m.served.text] : null])));
  if (m.hasEfris) {
    boxes.push(m.fiscal
      ? box('Section B · URA information', kv([['FDN', m.fdn.text, 'strong'], has(m.ver) ? ['Verification code', m.ver.text, 'code'] : null,
          has(m.invId) ? ['Invoice ID', m.invId.text] : null, has(m.sub) ? ['Issued', m.sub.text] : null]))
      : box('Section B · URA information', '<div class="notice">' + (m.kind === 'credit'
          ? 'No credit note FDN yet. URA assigns it when it approves the credit note application.'
          : 'This document has not been submitted to URA EFRIS and has no Fiscal Document Number.') + '</div>'));
  }
  var buyer = [];
  if (rec.name) buyer.push(['Name', rec.name, 'strong']);
  m.buyer.forEach(function (f) { if (has(f)) buyer.push([f.label, fieldVal(f), '', 1]); });
  if (rec.address) buyer.push(['Address', rec.address]);
  if (rec.email) buyer.push(['Email', rec.email]);
  if (buyer.length) boxes.push(box(m.kind === 'receipt' ? 'Section C · Buyer' : 'Section C · Bill to', kv(buyer)));
  var doc = [];
  if (d.reference) doc.push([m.kind === 'invoice' ? 'Invoice no.' : m.kind === 'credit' ? 'Credit note no.' : m.kind === 'debit' ? 'Debit note no.' : m.kind === 'payment' ? 'Payment no.' : 'Receipt no.', d.reference, 'strong']);
  (d.subtitles || []).forEach(function (s) { var p = String(s).split(/:\s+/); doc.push(p.length > 1 ? [p[0], p.slice(1).join(': ')] : ['', s]); });
  m.other.forEach(function (f) { if (has(f)) doc.push([f.label, fieldVal(f), '', 1]); });
  if (doc.length) boxes.push(box('Document', kv(doc)));
  h += '<div class="grid2">' + boxes.join('') + '</div>';

  var t = d.table;
  if (t && Array.isArray(t.columns) && t.columns.length) {
    var cols = t.columns;
    var fold = [], main = [];
    cols.forEach(function (c, i) { (/commodit|categor/i.test((c.label || '') + ' ' + (c.key || '')) ? fold : main).push(i); });
    // Drop a Description column that only repeats the item name on every line
    // (Manager fills it from the item by default).
    var iItem = -1, iDesc = -1;
    cols.forEach(function (c, i) { var l = String(c.label || '').toLowerCase(); if (iItem < 0 && /item/.test(l)) iItem = i; if (iDesc < 0 && /descr/.test(l)) iDesc = i; });
    if (iItem >= 0 && iDesc >= 0) {
      var dup = true;
      (function walk(l) { (l || []).forEach(function (r) { if (r.rows && r.rows.length) return walk(r.rows); if (r.isTotalRow) return; var it = String(((r.cells || [])[iItem] || {}).text || '').toLowerCase(), de = String(((r.cells || [])[iDesc] || {}).text || '').trim().toLowerCase(); if (de && it.indexOf(de) < 0) dup = false; }); })(t.rows);
      if (dup) main = main.filter(function (i) { return i !== iDesc; });
    }
    var al = function (c) { return (c.align === 'right' || c.align === 'end') ? 'r' : c.align === 'center' ? 'c' : ''; };
    // Manager heads the quantity column with the unit name when every line shares
    // one unit (e.g. "BS-Bottle, ..."): label it Qty and keep the unit under it.
    var KNOWN = /item|descr|qty|quant|price|total|amount|disc|tax|vat|code|account|unit/i;
    var numeric = function (i) { var n = 0, ok = true; (function walk(l) { (l || []).forEach(function (r) { if (r.rows && r.rows.length) return walk(r.rows); if (r.isTotalRow) return; var t = String(((r.cells || [])[i] || {}).text || '').trim(); if (t) { n++; if (!/^-?[\d,.]+$/.test(t)) ok = false; } }); })(t.rows); return ok && n > 0; };
    var head = function (i) { var lab = String(cols[i].label || ''); return (i > 0 && lab && !KNOWN.test(lab) && numeric(i)) ? 'Qty<div class="it-sub">' + esc(lab) + '</div>' : esc(lab); };
    var tb = '<table class="items"><thead><tr>' + main.map(function (i) { return '<th class="' + al(cols[i]) + '">' + head(i) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows(t.rows || [], cols, main, fold, al) + '</tbody></table>';
    h += box('Section D · Goods and services', (t.description ? '<div class="desc">' + esc(t.description) + '</div>' : '') + tb);
  }

  var left = '';
  if (d.status && d.status.text) left += box('Payment', '<span class="status">' + esc(d.status.text) + '</span>' + payHow(d.status.tone));
  else { var ph = payHow('neutral'); if (ph) left += box('How to pay', ph); }
  var sm = '';
  (d.totals || []).forEach(function (x) { sm += '<div class="ln' + (x.emphasis ? ' gross' : '') + '"><span>' + esc(x.label) + '</span><span>' + esc(x.text) + '</span></div>'; });
  if (left || sm) h += '<div class="lower"><div>' + left + '</div>' + (sm ? box('Section F · Summary', '<div class="sum">' + sm + '</div>') : '<div></div>') + '</div>';

  if (SHOW.signatures) h += '<div class="sigs"><div>Received by (name, signature, date)</div><div>Authorised signature and stamp</div></div>';
  if (m.fiscal) {
    var q = has(m.qr) ? qrImg(m.qr.text) : '';
    h += '<div class="verify"' + (q ? '' : ' style="grid-template-columns:1fr"') + '>' + (q ? '<div class="qr">' + q + '</div>' : '') +
      '<div class="vt"><div class="vh">VERIFY THIS DOCUMENT</div>Scan the QR code or enter the FDN and verification code at efris.ura.go.ug.<br>' +
      '<span style="color:var(--muted)">This document was submitted electronically to the Uganda Revenue Authority (URA) EFRIS and bears a valid Fiscal Document Number.</span></div></div>';
  }
  if (Array.isArray(d.footers) && d.footers.length) h += '<div class="footers">' + d.footers.join('') + '</div>';
  if (PREFS.footer) h += '<div class="msg">' + esc(PREFS.footer) + '</div>';
  h += '<div class="end"><span>' + esc(stamp()) + '</span></div>';
  return h;
}
// Bank / mobile money details from Customize, shown while something is still owed.
function payHow(tone) {
  if (tone === 'positive' || m_kind() === 'credit') return '';
  // Payment fields on the invoice (from Sales Invoices Form Defaults) or on Business
  // Details win over Customize.
  var p = Object.assign({}, PREFS.pay || {}), r = [], bf = ((DOC && DOC.biz.fields) || []).concat((DOC && DOC.payFields) || []);
  [['bank', ['bank']], ['accName', ['account name']], ['accNo', ['account number', 'account no']], ['momo', ['mobile money', 'momo']], ['terms', ['payment terms', 'terms']]].forEach(function (x) {
    var f = findField(bf.filter(has), x[1]); if (f && !(x[0] === 'bank' && /account/i.test(f.label || ''))) p[x[0]] = f.text;
  });
  if (p.bank) r.push(['Bank', p.bank]); if (p.accName) r.push(['Account name', p.accName]); if (p.accNo) r.push(['Account no.', p.accNo]);
  if (p.momo) r.push(['Mobile money', p.momo]); if (p.terms) r.push(['Terms', p.terms]);
  return r.length ? kv(r) : '';
}
function m_kind() { return DOC ? DOC.kind : ''; }
function rows(list, cols, main, fold, al) {
  var h = '';
  (list || []).forEach(function (r) {
    if (Array.isArray(r.rows) && r.rows.length) {
      h += '<tr class="group"><td colspan="' + main.length + '">' + esc((r.cells && r.cells[0] && r.cells[0].text) || '') + '</td></tr>' + rows(r.rows, cols, main, fold, al);
      return;
    }
    var cells = r.cells || [], sub = '';
    if (!r.isTotalRow) fold.forEach(function (fi) { var c = cells[fi]; if (c && c.text) sub += '<div class="it-sub">' + esc((cols[fi].label || '') + ': ' + c.text) + '</div>'; });
    h += '<tr' + (r.isTotalRow ? ' class="total"' : '') + '>' + main.map(function (i, pos) {
      var c = cells[i] || {}, inner = (c.image && c.image.url) ? '<img src="' + esc(c.image.url) + '" alt="' + esc(c.text || '') + '" style="max-height:36px;"/>' : esc(c.text || '');
      if (c.link && isUrl(c.link.url)) inner = '<a target="_top" href="' + esc(c.link.url) + '">' + inner + '</a>';
      return '<td class="' + al(cols[i] || {}) + '">' + inner + (pos === 0 ? sub : '') + '</td>';
    }).join('') + '</tr>';
  });
  return h;
}

function renderSlip(m) {
  var d = m.d, biz = m.biz, rec = m.rec, h = '';
  var srow = function (k, v) { return '<div class="sl-row"><span>' + esc(k) + '</span><span class="sl-wrap">' + esc(v || '') + '</span></div>'; };
  h += '<div class="sl-c"><div class="sl-big">' + esc(String(m.name || '').toUpperCase()) + '</div>' + m.addrLines.map(function (l) { return '<div class="sl-wrap" style="white-space:pre-line">' + esc(l) + '</div>'; }).join('') +
    (m.bizTin ? '<div class="sl-b">TIN: ' + esc(m.bizTin.text) + '</div>' : '') + (m.bizBrn ? '<div>BRN: ' + esc(cleanBrn(m.bizBrn.text)) + '</div>' : '') + '</div>';
  h += '<div class="sl-c sl-b sl-band">' + esc(String(m.title).toUpperCase()) + '</div><div>';
  if (d.reference) h += srow('No.', d.reference);
  (d.subtitles || []).forEach(function (s) { h += '<div class="sl-wrap">' + esc(s) + '</div>'; });
  if (rec.name) h += srow('Buyer', rec.name);
  m.buyer.forEach(function (f) { if (has(f)) h += srow(f.label, f.text); });
  if (SHOW.servedBy !== false && has(m.served)) h += srow('Served by', m.served.text);
  h += '</div><div class="sl-dash"></div>';
  var t = d.table;
  if (t && Array.isArray(t.columns)) {
    var cols = t.columns, last = cols.length - 1;
    var flat = []; (function walk(l) { (l || []).forEach(function (r) { if (Array.isArray(r.rows) && r.rows.length) walk(r.rows); else if (!r.isTotalRow) flat.push(r); }); })(t.rows);
    flat.forEach(function (r) {
      var c = r.cells || [], mid = [];
      cols.forEach(function (col, i) { if (i > 0 && i < last && c[i] && c[i].text && !/\bvat\b|tax|commodit|categor/i.test(col.label || '')) mid.push(c[i].text); });
      h += '<div><div class="sl-b sl-wrap">' + esc((c[0] && c[0].text) || '') + '</div><div class="sl-row"><span>' + esc(mid.join(' x ')) + '</span><span>' + esc((c[last] && c[last].text) || '') + '</span></div></div>';
    });
    h += '<div class="sl-dash"></div>';
  }
  h += '<div>' + (d.totals || []).map(function (x) { return x.emphasis ? '<div class="sl-row sl-big sl-band"><span>' + esc(String(x.label).toUpperCase()) + '</span><span>' + esc(x.text) + '</span></div>' : srow(String(x.label).toUpperCase(), x.text); }).join('') + '</div>';
  if (d.status && d.status.text) h += '<div class="sl-c sl-b">' + esc(String(d.status.text).toUpperCase()) + '</div>';
  h += '<div class="sl-dash"></div>';
  if (m.fiscal) {
    h += '<div><div class="sl-c sl-b">*** URA EFRIS ***</div><div>FDN: <span class="sl-b">' + esc(m.fdn.text) + '</span></div>' +
      (has(m.ver) ? '<div>VERIFICATION CODE:</div><div class="sl-b sl-wrap">' + esc(m.ver.text) + '</div>' : '') +
      (has(m.dev) ? '<div>DEVICE: ' + esc(m.dev.text) + '</div>' : '') + (has(m.sub) ? '<div>ISSUED: ' + esc(m.sub.text) + '</div>' : '') + '</div>';
    var q = has(m.qr) ? qrImg(m.qr.text) : '';
    if (q) h += '<div class="sl-qr">' + q + '</div>';
    h += '<div class="sl-c">Verify at efris.ura.go.ug</div>';
  } else if (m.hasEfris) h += '<div class="sl-c sl-b">NOT FISCALISED</div>';
  if (PREFS.footer) h += '<div class="sl-c sl-wrap" style="white-space:pre-line">' + esc(PREFS.footer) + '</div>';
  h += '<div class="sl-c">' + esc(stamp()) + '</div>';
  return h;
}

/* Paper: remembered per document kind on this computer. */
function lastKey() { return 'efris_theme_paper_' + (DOC ? DOC.kind : 'doc'); }
function choosePaper() {
  try { var l = localStorage.getItem(lastKey()); if (PAPERS.indexOf(l) >= 0) return l; } catch (e) {}
  var p = PREFS.paper && DOC && PREFS.paper[DOC.kind]; if (PAPERS.indexOf(p) >= 0) return p;
  return DOC && DOC.kind === 'receipt' ? 'A5' : 'A4';
}
function pickPaper(p) { PAPER = PAPERS.indexOf(p) >= 0 ? p : 'A4'; try { localStorage.setItem(lastKey(), PAPER); } catch (e) {} render(); }
function render() {
  if (!DOC) return;
  var sh = el('sheet'), slip = PAPER === '80mm' || PAPER === '58mm';
  sh.className = slip ? ('slip' + (PAPER === '58mm' ? ' w58' : '')) : ('page' + (PAPER === 'A5' ? ' a5' : PAPER === 'A6' ? ' a6' : ''));
  sh.style.width = slip ? '' : ({ A4: 794, Letter: 816, A5: 559, A6: 397 }[PAPER] + 'px');
  sh.innerHTML = slip ? renderSlip(DOC) : renderPage(DOC);
  var z = PAGE_MM[PAPER];
  el('pageCss').textContent = slip ? '@page{margin:0}' : '@page{size:' + (PAPER === 'Letter' ? 'letter' : PAPER) + ';margin:' + z[2] + 'mm}';
  el('paperSel').innerHTML = PAPERS.map(function (p) { return '<button type="button" class="' + (p === PAPER ? 'on' : '') + '" aria-pressed="' + (p === PAPER) + '" onclick="pickPaper(\'' + p + '\')">' + p + '</button>'; }).join('');
}
/* One sheet when it nearly fits: scale for printing (not below 75%). */
window.addEventListener('beforeprint', function () {
  var z = PAGE_MM[PAPER], sh = el('sheet'); if (!z) return;
  var f = ((z[1] - 2 * z[2]) / (z[0] - 2 * z[2])) * sh.offsetWidth / sh.scrollHeight;
  f = f < 1 && f >= 0.75 ? f : 1;
  sh.style.zoom = String(((z[0] - 2 * z[2]) / 25.4 * 96) / sh.offsetWidth * f * 0.995);
});
window.addEventListener('afterprint', function () { el('sheet').style.zoom = ''; });

fetch('/api4/view-v1' + window.location.search, { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
  .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function (d) {
    if (!d || typeof d !== 'object') throw new Error('no document data');
    DOC = model(d);
    document.title = DOC.title + (d.reference ? ' ' + d.reference : '') + (DOC.biz.name ? ' - ' + DOC.biz.name : '');
    PAPER = choosePaper(); render();
  })
  .catch(function (e) {
    el('stage').innerHTML = '<div class="err"><strong>This document could not be loaded.</strong><br>Manager did not return the document data (' + esc(e.message) + '). Close this view and open the document again. If it keeps happening, switch the document back to Manager\'s standard theme and tell your EFRISConnect support contact.</div>';
  });
</script>
