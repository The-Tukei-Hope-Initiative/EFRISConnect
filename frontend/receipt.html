<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EFRISConnect - Document</title>
<link rel="icon" type="image/svg+xml" href="/efrisconnect-icon.svg">
<!-- Fully offline: system fonts only, no CDN. The QR encoder is injected by the
     relay at the marker below (GET /receipt); html2pdf is served locally. -->
<script>/*@QRLIB@*/</script>
<script src="html2pdf.bundle.min.js"></script>
<style>
button,input,select,textarea{font-family:inherit;}
/* Brand fonts, served by the relay (SIL Open Font License, see /fonts/OFL-NOTICE.txt). */
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/Inter-400.woff2) format('woff2');}@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/Inter-500.woff2) format('woff2');}@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/Inter-600.woff2) format('woff2');}@font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/Inter-700.woff2) format('woff2');}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;font-display:swap;src:url(/fonts/JetBrainsMono-latin.woff2) format('woff2');}

:root {
  --band: #1f2937;          /* section band colour (Customize) */
  --ink: #111111;
  --muted: #4b5563;
  --rule: #111111;
  --hair: #d1d5db;
  --ui: #14532d;            /* toolbar accent */
  --sans: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Cascadia Mono', Consolas, 'Roboto Mono', ui-monospace, monospace;
  /* The document itself uses Arial / Courier New: the same letter widths as the
     PDF's built-in Helvetica / Courier, so Save PDF writes real text that lines up
     with the preview (URA's own PDFs are Helvetica-style vector text too). */
  --doc: 'Inter', Arial, Helvetica, 'Liberation Sans', sans-serif;
  --docmono: 'JetBrains Mono', 'Courier New', Courier, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 13px; }
body { font-family: var(--sans); color: var(--ink); background: #e5e7eb; min-height: 100vh; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; }

/* ── Toolbar (screen only) ── */
#tb { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--hair); padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
#tbLeft, #tbRight { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.chip { font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: #dcfce7; color: #14532d; }
.chip.warn { background: #fef3c7; color: #78350f; }
.chip.bad { background: #fee2e2; color: #7f1d1d; }
.chip.info { background: #e0e7ff; color: #1e3a8a; }
.chip.plain { background: #f3f4f6; color: #374151; }
#tbDoc { font-size: 12.5px; color: #374151; }
#paperSel { display: flex; border: 1px solid #9ca3af; border-radius: 8px; overflow: hidden; }
#paperSel button { min-height: 36px; padding: 0 10px; border: 0; border-right: 1px solid var(--hair); background: #fff; color: #111827; font-size: 12.5px; font-weight: 600; cursor: pointer; }
#paperSel button:last-child { border-right: 0; }
#paperSel button.on { background: var(--ui); color: #fff; }
.tbtn { min-height: 36px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--ui); background: #fff; color: var(--ui); text-decoration: none; display: inline-flex; align-items: center; }
.tbtn.primary { background: var(--ui); color: #fff; }
.tbtn.done { border-color: #9ca3af; background: #f3f4f6; color: #374151; cursor: default; }
.tbtn:disabled { opacity: .6; cursor: default; }
#tbNote { flex-basis: 100%; font-size: 12.5px; color: #064e3b; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 8px; padding: 6px 10px; display: none; }
#tbNote.err { color: #7f1d1d; background: #fef2f2; border-color: #fecaca; }

/* ── Customize panel (screen only) ── */
#cz { display: none; max-width: 1100px; margin: 12px auto 0; background: #fff; border: 1px solid var(--hair); border-radius: 12px; padding: 16px 18px; gap: 18px 28px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
#cz.open { display: grid; }
#cz h3 { font-size: 11.5px; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
#cz label { display: flex; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; cursor: pointer; }
#cz input[type=text], #cz textarea, #cz select { width: 100%; border: 1px solid #9ca3af; border-radius: 6px; padding: 5px 8px; font-size: 13px; }
#cz textarea { min-height: 58px; resize: vertical; }
#cz .row { display: flex; gap: 8px; align-items: center; }
#cz .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
#cz .sw { width: 30px; height: 30px; border-radius: 6px; border: 1px solid #9ca3af; cursor: pointer; }
#cz .sw.on { outline: 3px solid #f59e0b; outline-offset: 1px; }
#cz .czCustom { display: inline-flex; align-items: center; gap: 6px; padding: 2px 6px 2px 2px; border: 1px solid #9ca3af; border-radius: 8px; }
#cz .czCustom.on { outline: 3px solid #f59e0b; outline-offset: 1px; }
#cz .czCustom input[type=color] { width: 30px; height: 28px; border: 0; padding: 0; background: none; cursor: pointer; }
#cz .czCustom input[type=text] { width: 78px; font: 12px var(--mono); padding: 4px 6px; border: 1px solid var(--hair); border-radius: 6px; }
#czLogoPrev { width: 54px; height: 54px; border: 1.5px dashed #9ca3af; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--muted); overflow: hidden; }
#czLogoPrev img { max-width: 100%; max-height: 100%; }
#czFoot { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 10px; align-items: center; border-top: 1px solid var(--hair); padding-top: 10px; font-size: 12px; color: var(--muted); }

/* ── Sheet ── */
#stage { padding: 18px 0 60px; }
#sheet { --muted: #333333; font-family: var(--doc); color: #000; width: 794px; margin: 0 auto; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.18); position: relative; overflow: hidden; }
#sheet.page { padding: 40px 44px 28px; display: flex; flex-direction: column; gap: 14px; }

/* page header */
.hd { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding-bottom: 12px; border-bottom: 3px double var(--rule); }
/* The logo sits on top of the business name and details, never beside them. */
.hd-left { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; min-width: 0; }
.hd-left > div { min-width: 0; }
/* Square and wide logos alike: fixed height, width follows the logo up to a limit. */
.hd-logo { width: auto; height: 64px; max-width: 220px; object-fit: contain; object-position: left center; flex-shrink: 0; }
.hd-name { font-size: 22px; font-weight: 700; letter-spacing: -.2px; line-height: 1.15; }
.hd-name2 { font-size: 12.5px; font-weight: 600; margin-top: 1px; }
.hd-lines { font-size: 11.5px; margin-top: 3px; line-height: 1.5; }
.hd-right { text-align: right; align-self: center; }
.hd-title { font-size: 21px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
.hd-sub { font-size: 11.5px; margin-top: 2px; }

/* boxes */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.box { border: 1px solid var(--rule); break-inside: avoid; page-break-inside: avoid; }
.box-h { background: var(--band); color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; padding: 4px 10px; text-transform: uppercase; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.kv { display: grid; grid-template-columns: 134px minmax(0, 1fr); column-gap: 0; padding: 4px 10px 6px; font-size: 12px; line-height: 1.35; }
/* Ruled rows (like URA's own layout): label and value share one baseline per row. */
.kv .k, .kv .v { padding: 4px 0; border-bottom: 1px solid #e5e7eb; }
.kv .k { padding-right: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv .k:nth-last-child(2), .kv .v:last-child { border-bottom: 0; }
.kv .v { overflow-wrap: anywhere; }
.kv .v.strong { font-weight: 700; }
.mono { font-family: var(--docmono); letter-spacing: 0; }
.kv .v.code { font-size: 11px; }
.notice { padding: 8px 10px; font-size: 12px; }

/* items */
table.items { width: 100%; border-collapse: collapse; font-size: 12px; }
table.items thead th { vertical-align: bottom; text-align: left; font-size: 10.5px; font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.items td { line-height: 1.35; padding: 7px 8px; border-bottom: 1px solid var(--hair); vertical-align: top; }
table.items tr { break-inside: avoid; page-break-inside: avoid; }
table.items tbody tr:last-child td { border-bottom: 0; }
table.items .r { text-align: right; white-space: nowrap; }
table.items th:first-child, table.items td:first-child { width: 34px; }
table.items th:last-child, table.items td:last-child { width: 96px; }
table.items .c { text-align: center; }
.it-name { font-weight: 600; }
.it-sub { font-size: 10.5px; color: var(--muted); margin-top: 1px; }

/* tax + summary */
.tax-t { width: 100%; border-collapse: collapse; font-size: 12px; }
.tax-t th { text-align: left; font-size: 10.5px; padding: 6px 10px; border-bottom: 1px solid var(--rule); }
.tax-t td { padding: 6px 10px; }
.tax-t .r { text-align: right; white-space: nowrap; }
.tax-t tbody tr + tr td { border-top: 1px solid #e5e7eb; }
.sum { padding: 8px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.sum .ln { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sum .ln span:last-child { text-align: right; white-space: nowrap; }
.sum .ln span:first-child { white-space: nowrap; }
#sheet.a5 .sum .ln { gap: 6px; }
.sum .gross { font-size: 15px; font-weight: 700; border-top: 1px solid var(--rule); padding-top: 5px; margin-top: 2px; }
.sum .bal { font-weight: 700; }
.words { font-size: 11px; color: var(--muted); font-style: italic; padding: 0 10px 8px; }

/* verify + footer */
.verify { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 12px; border: 1px solid var(--rule); break-inside: avoid; page-break-inside: avoid; }
.qr img { width: 118px; height: 118px; image-rendering: pixelated; display: block; }
.verify .vt { font-size: 12px; line-height: 1.5; }
.verify .vh { font-weight: 700; letter-spacing: 1px; margin-bottom: 2px; }
.msg { font-size: 12px; white-space: pre-line; border-top: 1px solid var(--hair); padding-top: 8px; }
.sigs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; padding-top: 22px; font-size: 11.5px; break-inside: avoid; }
.sigs div { border-top: 1px solid var(--rule); padding-top: 4px; }
.sigs img { max-height: 40px; display: block; margin: -44px 0 4px; }
.end { display: flex; justify-content: center; gap: 10px; font-size: 10.5px; color: var(--muted); border-top: 1px solid var(--hair); padding-top: 8px; }
.wm { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.wm span { font-size: 150px; font-weight: 700; letter-spacing: 16px; color: rgba(17,17,17,.07); transform: rotate(-30deg); }

/* A5 / A6: same layout, tighter */
#sheet.a5 { padding: 28px 28px 20px; gap: 11px; }
#sheet.a5 .hd-name { font-size: 18px; } #sheet.a5 .hd-title { font-size: 16px; }
#sheet.a5 .kv { grid-template-columns: 106px minmax(0, 1fr); font-size: 11px; }
#sheet.a5 table.items, #sheet.a5 .tax-t, #sheet.a5 .sum { font-size: 11px; }
/* A5: tighter rows and a smaller QR so a typical receipt fits one sheet */
#sheet.a5 .hd { padding-bottom: 8px; } #sheet.a5 .hd-logo { width: auto; height: 48px; max-width: 160px; }
#sheet.a5 .box-h { padding: 3px 8px; font-size: 9.5px; }
#sheet.a5 .kv .v.code { font-size: 9.5px; }
#sheet.a5 .kv { padding: 2px 8px 4px; line-height: 1.3; } #sheet.a5 .kv .k, #sheet.a5 .kv .v { padding: 2px 0; }
#sheet.a5 table.items th, #sheet.a5 table.items td { padding: 4px 6px; }
#sheet.a5 .tax-t th, #sheet.a5 .tax-t td { padding: 4px 8px; }
#sheet.a5 .sum { padding: 6px 8px; gap: 2px; } #sheet.a5 .sum .gross { font-size: 11.5px; }
.tax-t td:first-child { white-space: normal; }
.tax-t th.r { white-space: nowrap; }
.tax-t { font-variant-numeric: tabular-nums; }
#sheet.a5 .tax-t th, #sheet.a5 .tax-t td:not(:first-child) { padding-left: 4px; }
#sheet.a5 .verify { padding: 8px; gap: 12px; } #sheet.a5 .verify .vt { font-size: 10.5px; }
#sheet.a5 .qr img { width: 84px; height: 84px; }
#sheet.a5 .sigs { padding-top: 16px; }
/* A6 (105 x 148 mm): a compact card, not a shrunken A4. Slim section labels instead of
   dark bands, label and value on one line, no outer boxes, items without No. and URA
   code columns, QR centred with the fiscal details. */
#sheet.a6 { padding: 14px 14px 12px; gap: 8px; }
#sheet.a6 .hd { grid-template-columns: 1fr; gap: 6px; padding-bottom: 8px; border-bottom: 2px solid var(--rule); }
#sheet.a6 .hd-left { gap: 10px; }
#sheet.a6 .hd-logo { width: auto; height: 34px; max-width: 130px; }
#sheet.a6 .hd-name { font-size: 14px; }
#sheet.a6 .hd-name2 { font-size: 10.5px; }
#sheet.a6 .hd-lines { font-size: 9.5px; line-height: 1.4; }
#sheet.a6 .hd-right { text-align: left; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
#sheet.a6 .hd-title { font-size: 12px; letter-spacing: 1.5px; }
#sheet.a6 .hd-sub { font-size: 9px; margin: 0; }
#sheet.a6 .grid2 { grid-template-columns: 1fr; gap: 6px; }
#sheet.a6 .box { border: 0; }
#sheet.a6 .box-h { background: none; color: var(--band); border-bottom: 1.5px solid var(--band); font-size: 8.5px; letter-spacing: 1.2px; padding: 0 0 2px; }
#sheet.a6 .kv { grid-template-columns: auto minmax(0, 1fr); column-gap: 0; padding: 2px 0 0; font-size: 10px; line-height: 1.3; }
#sheet.a6 .kv .k { padding-right: 10px; }
#sheet.a6 .kv .k, #sheet.a6 .kv .v { padding: 2px 0; border-bottom: 1px solid var(--hair); }
#sheet.a6 .kv .k { font-size: 9px; color: var(--muted); }
#sheet.a6 .kv .v { text-align: right; }
#sheet.a6 .kv .v.code { font-size: 9.5px; }
#sheet.a6 table.items, #sheet.a6 .tax-t, #sheet.a6 .sum { font-size: 9.5px; }
#sheet.a6 table.items th:first-child, #sheet.a6 table.items td:first-child { display: none; }
#sheet.a6 table.items thead th { font-size: 8.5px; padding: 3px 3px; }
#sheet.a6 table.items td { padding: 4px 3px; }
#sheet.a6 .it-sub { font-size: 8.5px; }
#sheet.a6 .tax-t th, #sheet.a6 .tax-t td { padding: 3px 3px; }
#sheet.a6 .verify { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 6px; padding: 8px 0; }
#sheet.a6 .verify .vt { font-size: 9px; }
#sheet.a6 .qr img { width: 92px; height: 92px; }
#sheet.a6 .wm span { font-size: 60px; }

/* ── Thermal slip (80mm / 58mm) ── */
#sheet.slip { width: 302px; padding: 14px 12px 18px; font-family: var(--docmono); color: #000; font-size: 11.5px; line-height: 1.45; display: flex; flex-direction: column; gap: 8px; }
#sheet.slip.w58 { width: 219px; padding: 10px 8px 14px; font-size: 10.5px; }
.sl-c { text-align: center; }
.sl-logo { display: block; margin: 0 auto 6px; max-width: 62%; max-height: 64px; object-fit: contain; }
.sl-b { font-weight: 700; }
.sl-big { font-size: 14px; font-weight: 700; }
.sl-row { display: flex; justify-content: space-between; gap: 6px; }
.sl-row > span:last-child { text-align: right; white-space: nowrap; }
.sl-dash { border-top: 1px dashed #000; }
.sl-band { border-top: 1.5px solid #000; border-bottom: 1.5px solid #000; padding: 3px 0; }
.sl-wrap { overflow-wrap: anywhere; }
.sl-tax { display: grid; grid-template-columns: 22px 1fr 1fr 1fr; font-size: .92em; }
.sl-tax div:not(:first-child) { text-align: right; }
.sl-qr { display: flex; justify-content: center; }
.sl-qr img { width: 150px; height: 150px; image-rendering: pixelated; }
#sheet.slip.w58 .sl-qr img { width: 130px; height: 130px; }
#sheet.slip .wm span { font-size: 64px; letter-spacing: 6px; color: rgba(0,0,0,.08); }

/* ── Clean layout (Customize > Layout): thin rules, lettered section labels, the
   total, payment status and fiscal details easy to find ── */
#sheet.clean { color: #16201a; --cl-soft: #4b5563; --cl-faint: #6b7280; --cl-rule: #d1d5db; }
#sheet.clean.page { gap: 0; font-size: 13px; line-height: 1.35; }
.cl-hd { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; }
/* The logo sits on top of the seller details, never beside them. */
.cl-seller { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; min-width: 0; }
.cl-seller > div { min-width: 0; }
.cl-logo { height: 60px; width: auto; max-width: 200px; object-fit: contain; object-position: left center; flex: none; }
.cl-accent { width: 36px; height: 4px; background: var(--band); margin-bottom: 10px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.cl-lbl { font-size: 9.5px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; color: var(--band); }
.cl-biz { font-size: 23px; font-weight: 700; line-height: 1.1; margin-top: 3px; }
.cl-biz2 { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
.cl-sub { font-size: 12px; color: var(--cl-soft); margin-top: 5px; line-height: 1.5; }
.cl-title { text-align: right; flex: none; }
.cl-title h1 { font-size: 20px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.cl-title div { font-size: 12px; color: var(--cl-soft); }
.cl-facts { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 14px; border-top: 2px solid #16201a; border-bottom: 1px solid var(--cl-rule); padding: 11px 0; margin: 16px 0; }
.cl-facts .k { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--cl-soft); }
.cl-facts .v { font-size: 15px; font-weight: 700; margin-top: 2px; }
.cl-facts > div:last-child { text-align: right; }
.cl-st-paid { color: var(--band); } .cl-st-part { color: #b45309; } .cl-st-unpaid { color: #b91c1c; }
.cl-sec { font-size: 9.5px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; color: var(--band); padding-bottom: 4px; border-bottom: 1.5px solid var(--band); margin-bottom: 6px; }
.cl-two { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; margin-bottom: 16px; }
.cl-two > div:last-child { justify-self: end; width: 100%; max-width: 270px; min-width: 190px; }
.cl-kv { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 14px; row-gap: 3px; font-size: 12px; }
.cl-kv .k { color: var(--cl-soft); white-space: nowrap; }
.cl-kv .v { font-weight: 500; overflow-wrap: anywhere; }
.cl-kv .v.b { font-weight: 700; }
.cl-kv .v.nw { white-space: nowrap; overflow-wrap: normal; }
.cl-kv .v.fdn { font-size: 16px; font-weight: 700; }
.cl-note { font-size: 12px; margin: 0 0 12px; }
.cl-notice { font-size: 12px; color: var(--cl-soft); }
table.cl-items { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.cl-items th { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--cl-soft); text-align: left; padding: 0 8px 5px 0; border-bottom: 1px solid var(--cl-rule); white-space: nowrap; }
table.cl-items td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--cl-rule); vertical-align: top; }
table.cl-items th:last-child, table.cl-items td:last-child { padding-right: 0; }
table.cl-items .r { text-align: right; white-space: nowrap; }
table.cl-items tr { break-inside: avoid; page-break-inside: avoid; }
.cl-nm { font-weight: 600; } .cl-cd { font-size: 11px; color: var(--cl-faint); margin-top: 2px; } .cl-amt { font-weight: 700; }
.cl-lower { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 16px; break-inside: avoid; page-break-inside: avoid; }
table.cl-tax { width: 100%; border-collapse: collapse; font-size: 12px; }
table.cl-tax th { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--cl-soft); text-align: right; padding: 0 0 4px 6px; border-bottom: 1px solid var(--cl-rule); }
table.cl-tax th:first-child { text-align: left; padding-left: 0; }
table.cl-tax td { padding: 5px 0 5px 6px; border-bottom: 1px solid var(--cl-rule); text-align: right; white-space: nowrap; }
table.cl-tax td:first-child { text-align: left; white-space: normal; padding-left: 0; }
.cl-small { font-size: 11px; color: var(--cl-faint); margin-top: 5px; }
.cl-sum { font-size: 12.5px; }
.cl-sum .ln { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.cl-sum .ln span:last-child { white-space: nowrap; text-align: right; }

<div id="stage"><div id="sheet"></div></div>

<script>
'use strict';
/* ══ URL data ══ */
const _ps = new URLSearchParams(location.search);
function qp(k, d) { const v = _ps.get(k); return v == null || v === '' ? (d || '') : v; }
// URLSearchParams has already decoded the value: parse it directly, and only fall
// back to decoding for callers that encoded it a second time. (Decoding first broke
// any item name containing "%".)
function qpJSON(k) {
  const raw = _ps.get(k); if (!raw) return [];
  try { const v = JSON.parse(raw); return Array.isArray(v) ? v : []; } catch (_) {}
  try { const v = JSON.parse(decodeURIComponent(raw)); return Array.isArray(v) ? v : []; } catch (_) { return []; }
}
function stash(v, key) { if (v === '__local__') { try { return localStorage.getItem(key) || ''; } catch (_) { return ''; } } return v; }

const D = {
  bizName: qp('bizName'), bizTrade: qp('bizTrade'), bizAddr: qp('bizAddr'), bizTin: qp('bizTin'), bizBrn: String(qp('bizBrn') || '').replace(/^.*\//, '').trim(), bizPhone: qp('bizPhone'), bizEmail: qp('bizEmail'),
  logoUrl: stash(qp('logoUrl'), 'efris_print_logo'),
  docType: qp('docType', 'Receipt'), ref: qp('ref'), fdn: qp('fdn'), date: qp('date'), currency: qp('currency', 'UGX'), dueDate: qp('dueDate'),
  custName: qp('custName'), custTin: qp('custTin'), custType: qp('custType').toLowerCase(), custAddr: qp('custAddr'), passport: qp('passport'), nationality: qp('nationality'),
  payMethods: qpJSON('payMethods'), payMethod: qp('payMethod'), payTerms: qp('payTerms'),
  lines: qpJSON('lines'),
  subtotal: qp('subtotal'), discount: qp('discount'), taxAmount: qp('taxAmount'), grandTotal: qp('grandTotal'), grandWords: qp('grandWords'),
  notes: qp('notes') || qp('description'), issuedBy: qp('issuedBy'), sigImg: stash(qp('sigImg'), 'efris_print_sig'),
  verCode: qp('verCode'), invId: qp('invId'), subDate: qp('subDate'), issuedTime: qp('issuedTime'), deviceNo: qp('deviceNo'), validationUrl: qp('validationUrl'),
  mode: qp('mode'), queued: qp('queued') === '1', copy: qp('copy') === '1', inMgr: qp('inMgr') === '1', mgrRef: qp('mgrRef'),
  cashTendered: qp('cashTendered'), cashChange: qp('cashChange'),
  oriFdn: qp('oriFdn'), cnReason: qp('cnReason'), viaEnabler: qp('viaEnabler') === '1', custNinBrn: qp('custNinBrn')
};
const DEMO = !_ps.has('bizName');
if (DEMO) Object.assign(D, {
  bizName: 'Demo Company Uganda Ltd', bizAddr: 'Plot 45, Kampala Road, Kampala', bizTin: '1000987654', bizBrn: '80020001234567', bizPhone: '+256 700 123 456', bizEmail: 'accounts@example.ug',
  docType: 'Tax Invoice', ref: 'REC-2026-0034', fdn: '325043855047', date: '07 Oct 2026', mode: 'sandbox',
  custName: 'James Omondi', custType: 'b2c', payMethods: [{ label: 'Mobile Money', amount: '14,720.00' }], issuedBy: 'Sarah N.',
  verCode: '79289983322183978289', invId: '10977703248839344', subDate: '2026-10-07', deviceNo: '1000987654_01',
  validationUrl: 'https://efristest.ura.go.ug/site_new/#/invoiceValidation?invoiceNo=325043855047&antiFakeCode=79289983322183978289',
  lines: [
    { name: 'Mineral Water 500ml', itemCode: 'WAT500', commodityCode: '50202301', qty: 10, unit: 'Bottle', rate: 1000, vatRate: 18, vatAmt: 1525.42, total: 10000 },
    { name: 'Maize Grain', itemCode: 'MAIZE', commodityCode: '50221101', qty: 2, unit: 'Kg', rate: 2360, vatRate: 0, taxCat: 'C', vatAmt: 0, total: 4720 }
  ], grandTotal: 14720
});

/* ══ Helpers ══ */
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function num(v) { const n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
function money(v) { return num(v).toLocaleString('en-UG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function el(id) { return document.getElementById(id); }
// Only a complete base64 image data URL: anchored at both ends with a strict
// base64 alphabet, so nothing can break out of the src="..." attribute it goes into.
function safeImg(u) { u = String(u || '').trim(); return /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+\/]+={0,2}$/i.test(u) ? u : ''; }

// Units arrive as EFRIS codes ("PCE"), "CODE-Name, qualifier" strings or names.
const UOM = { '101': 'Unit', 'PCE': 'Piece', 'PP': 'Piece', 'PS': 'Person', '207': 'Hour', 'HR': 'Hour', 'DAY': 'Day', 'KGM': 'Kg', '103': 'Kg', 'GRM': 'Gram', 'LTR': 'Litre', '102': 'Litre', 'MTR': 'Metre', 'SET': 'Set', 'BX': 'Box', 'PK': 'Pack', 'DZN': 'Dozen', 'DPC': 'Dozen', 'BO': 'Bottle', 'BS': 'Bottle', 'BQ': 'Bottle', 'BV': 'Bottle', 'BG': 'Bag', 'CT': 'Carton', '115': 'Month', 'PM2': 'Month', 'BR': 'Bar', '108': '' };
function unitName(u) {
  const c = String(u || '').trim(); if (!c) return '';
  if (Object.prototype.hasOwnProperty.call(UOM, c.toUpperCase())) return UOM[c.toUpperCase()];
  const m = c.match(/^([A-Za-z0-9]{1,4})\s*-\s*([^,]+)/);
  if (m) return UOM[m[1].toUpperCase()] || m[2].trim();
  return c;
}
// URA tax categories as printed on EFRIS documents.
const TAXCAT = { A: 'Standard (18%)', B: 'Zero rated (0%)', C: 'Exempt', D: 'Deemed (18%)' };
function taxCat(l) {
  const t = String(l.taxCat || l.vatCat || '').toUpperCase();
  if (TAXCAT[t]) return t;
  if (t === '01') return 'A'; if (t === '02') return 'B'; if (t === '03') return 'C'; if (t === '04') return 'D';
  return num(l.vatRate) > 0 || num(l.vatAmt) > 0 ? 'A' : 'C';
}

/* ══ Document facts ══ */
const FISCAL = !!D.fdn;
// receipt | invoice | credit. URA titles both a paid VAT receipt and an unpaid
// invoice "Tax Invoice", so the caller says which it is; guess only without it.
const KIND = ['receipt', 'invoice', 'credit', 'debit'].includes(qp('kind')) ? qp('kind')
  : /debit/i.test(D.docType) ? 'debit'
  : /credit/i.test(D.docType) ? 'credit'
  : (/^invoice$/i.test(D.docType) || D.payMethods.some(p => /credit/i.test(p.label || ''))) ? 'invoice' : 'receipt';
const LINES = D.lines.map(l => ({ ...l, cat: taxCat(l), unitTxt: unitName(l.unit), q: num(l.qty) || 1, rateN: num(l.rate), totalN: num(l.total), vatN: num(l.vatAmt), discN: num(l.discount) }));
const GROSS = num(D.grandTotal) || LINES.reduce((s, l) => s + l.totalN, 0);
const VAT = LINES.reduce((s, l) => s + l.vatN, 0) || num(D.taxAmount);
const NET = GROSS - VAT;
// Paid: real payments only ("Credit" is a promise to pay, not a payment).
const PAYS = (D.payMethods.length ? D.payMethods : (D.payMethod ? [{ label: D.payMethod, amount: '' }] : [])).map(p => ({ label: p.label || 'Cash', amt: p.amount === '' || p.amount == null ? null : num(p.amount) }));
// A credit or debit note: printed with its original invoice FDN and the reason.
const NOTE = KIND === 'credit' || KIND === 'debit';
const PAID = KIND === 'credit' ? 0 : PAYS.filter(p => !/credit/i.test(p.label)).reduce((s, p) => s + (p.amt == null ? GROSS : p.amt), 0);
const BAL = Math.max(0, Math.round((GROSS - PAID) * 100) / 100);
const PAYSTATE = KIND === 'credit' ? '' : (BAL <= 0.005 ? 'paid' : (PAID > 0 ? 'part' : 'unpaid'));
const BUYER = D.custName || (D.custType === 'b2c' || !D.custType ? 'Cash Customer' : '');
const CUR = /^[A-Z]{3}$/.test(D.currency) ? D.currency : 'UGX';

/* ══ Preferences: saved for the business through the extension, else this browser ══ */
const PAPERS = ['A4', 'A5', 'Letter', 'A6', '80mm', '58mm'];
const BANDS = [['#1f2937', 'Charcoal'], ['#14532d', 'Forest green'], ['#1e3a8a', 'Navy'], ['#7c2d12', 'Rust']];
const DEF = {
  layout: 'clean', band: '#1f2937', showLogo: true, logo: '', logoMono: false, slipLogo: true, nameMode: 'legal', footer: '',
  header: { address: true, phone: true, email: true, website: false, websiteText: '', pobox: false, poboxText: '' },
  pay: { bank: '', accName: '', accNo: '', momo: '', terms: '' },
  show: { itemCodes: true, uraCode: true, unit: true, discount: true, servedBy: true, signatures: false, notes: true },
  paper: { receipt: 'A5', invoice: 'A4', credit: 'A4' }
};
let P = JSON.parse(JSON.stringify(DEF));
let BRIDGE = false;                 // true when the extension answered
const LKEY = 'efris_receipt_prefs';
function merge(base, add) { const o = JSON.parse(JSON.stringify(base)); for (const k in add || {}) { if (add[k] && typeof add[k] === 'object' && !Array.isArray(add[k]) && typeof o[k] === 'object') o[k] = Object.assign(o[k], add[k]); else if (add[k] !== undefined) o[k] = add[k]; } return o; }
function loadLocal() { try { return JSON.parse(localStorage.getItem(LKEY) || 'null'); } catch (_) { return null; } }
let _saveT = null;
function savePrefs() {
  clearTimeout(_saveT);
  _saveT = setTimeout(() => {
    if (BRIDGE) send({ action: 'save-prefs', prefs: P });
    else { try { localStorage.setItem(LKEY, JSON.stringify(P)); } catch (_) {} }
  }, 250);
}
function send(msg) { try { parent.postMessage(Object.assign({ type: 'efc-receipt' }, msg), location.origin); } catch (_) {} }
const _pending = {};
window.addEventListener('message', ev => {
  if (ev.origin !== location.origin || ev.source !== parent) return;
  const m = ev.data || {}; if (m.type !== 'efc-receipt-reply') return;
  if (m.action === 'context') {
    BRIDGE = true;
    P = merge(DEF, m.prefs || {});
    if (m.logo) P.logo = m.logo;
    if (m.inManager) { D.inMgr = true; D.mgrRef = m.mgrRef || D.mgrRef; }
    MGR_CAN = !!m.canSave;
    el('czWhere').textContent = 'Saved for this business (' + (m.business || 'this business') + ').';
    applyPaper(choosePaper()); syncCz(); render();
    if (PRINT_KEY) send({ action: 'print-count', key: PRINT_KEY });
  }
  if (m.action === 'print-count') { if (m.ok) { RCOUNT = parseInt(m.count, 10) || 0; render(); } }
  if (m.action === 'save-result' && _pending.save) { _pending.save(m); delete _pending.save; }
});
let MGR_CAN = false;

/* ══ Paper ══ */
const LAST = 'efris_last_paper_' + KIND;   // per device, per document kind
function choosePaper() { const q = qp('paper'); if (PAPERS.includes(q)) return q; try { const l = localStorage.getItem(LAST); if (PAPERS.includes(l)) return l; } catch (_) {} return P.paper[KIND] || (KIND === 'receipt' ? 'A5' : 'A4'); }
let PAPER = 'A4';
function applyPaper(p) {
  PAPER = PAPERS.includes(p) ? p : 'A4';
  const css = {
    A4: '@page{size:A4;margin:10mm}', A5: '@page{size:A5;margin:7mm}', Letter: '@page{size:letter;margin:10mm}', A6: '@page{size:A6;margin:4mm}',
    '80mm': '@page{margin:0}', '58mm': '@page{margin:0}'
  }[PAPER];
  let st = el('pageCss'); if (!st) { st = document.createElement('style'); st.id = 'pageCss'; document.head.appendChild(st); }
  st.textContent = css;
  el('paperSel').querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.p === PAPER); b.setAttribute('aria-pressed', b.dataset.p === PAPER); });
}
function pickPaper(p) { applyPaper(p); try { localStorage.setItem(LAST, p); } catch (_) {} render(); }

/* ══ Render ══ */
function bizTitle() {
  const legal = D.bizName || 'Your Business', trade = D.bizTrade || '';
  if (P.nameMode === 'trade' && trade) return [trade, ''];
  if (P.nameMode === 'both' && trade && trade !== legal) return [trade, legal];
  return [legal, ''];
}
function headerLines() {
  const h = P.header, out = [];
  if ((h.address || KIND !== 'receipt') && D.bizAddr) out.push(D.bizAddr);
  if (h.pobox && h.poboxText) out.push(h.poboxText);
  const c = [];
  if (h.phone && D.bizPhone) c.push(D.bizPhone);
  if (h.email && D.bizEmail) c.push(D.bizEmail);
  if (h.website && h.websiteText) c.push(h.websiteText);
  if (c.length) out.push(c.join(' · '));
  return out;
}
function docTitle() { return D.docType || 'Receipt'; }
// URA's closing line and issuing mode (as on documents printed by EFRIS itself).
// A VAT seller's paid sale is titled "Tax Invoice" even when printed as a receipt.
function endLine() { return '*** END OF ' + (KIND === 'credit' ? 'CREDIT NOTE' : KIND === 'debit' ? 'DEBIT NOTE' : (KIND === 'invoice' || /invoice/i.test(docTitle())) ? 'e-INVOICE/TAX INVOICE' : 'e-RECEIPT') + ' ***'; }
function issueMode() { return D.viaEnabler ? 'Offline' : 'Online'; }
function docKind() { return showCopy() ? 'Copy' : 'Original'; }
function buyerType() { return { b2c: 'B2C · Individual', b2b: 'B2B · Business', b2g: 'B2G · Government', foreign: 'Foreigner' }[D.custType] || 'B2C · Individual'; }
function qrImg(cls) {
  const content = D.validationUrl || '';
  if (!content || typeof qrcode === 'undefined') return '';
  try { const q = qrcode(0, 'M'); q.addData(content); q.make(); return '<img alt="QR code: verify on URA EFRIS" class="' + cls + '" src="' + q.createDataURL(6, 4) + '"/>'; } catch (_) { return ''; }
}
function taxRows() {
  const g = {};
  LINES.forEach(l => { const k = l.cat; g[k] = g[k] || { net: 0, vat: 0, gross: 0 }; g[k].gross += l.totalN; g[k].vat += l.vatN; g[k].net += l.totalN - l.vatN; });
  return ['A', 'B', 'C', 'D'].filter(k => g[k]).map(k => ({ k, label: k + ': ' + TAXCAT[k], ...g[k] }));
}

function render() {
  const sh = el('sheet');
  const slip = PAPER === '80mm' || PAPER === '58mm';
  const clean = P.layout !== 'classic';
  sh.className = (slip ? ('slip' + (PAPER === '58mm' ? ' w58' : '')) : ('page' + (PAPER === 'A5' ? ' a5' : PAPER === 'A6' ? ' a6' : ''))) + (clean ? ' clean' : '');
  sh.style.width = slip ? '' : ({ A4: 794, Letter: 816, A5: 559, A6: 397 }[PAPER] + 'px');
  document.documentElement.style.setProperty('--band', P.band);
  document.documentElement.style.setProperty('--tint', tint(P.band, 0.09));
  sh.innerHTML = clean ? (slip ? renderCleanSlip() : PAPER === 'A6' ? renderCleanA6() : renderClean()) : (slip ? renderSlip() : renderPage());
  renderToolbar();
  fitScreen();
}
/* Narrow screens: zoom the on-screen sheet down to the window width. Screen only:
   printing sets its own zoom (beforeprint) and Save PDF clears it while it measures. */
function fitScreen() {
  const sh = el('sheet'); if (!sh) return;
  sh.style.zoom = '';
  const avail = (document.documentElement.clientWidth || window.innerWidth) - 16, w = sh.offsetWidth;
  if (avail > 0 && w > avail) sh.style.zoom = String(avail / w);
}
window.addEventListener('resize', () => { if (!window.matchMedia || !window.matchMedia('print').matches) fitScreen(); });

function renderPage() {

  h += box('Section C · Buyer', kv(buyer));

    '<th class="r">Unit price</th>' + (showDisc ? '<th class="r">Discount</th>' : '') + '<th class="c">Tax</th><th class="r">Amount</th></tr></thead><tbody>';
  LINES.forEach((l, i) => {
    const sub = [];

    t += '<tr><td>' + (i + 1) + '</td><td><div class="it-name">' + esc(l.name) + '</div>' + (sub.length ? '<div class="it-sub">' + esc(sub.join(' · ')) + '</div>' : '') + '</td>' +
      (showUra ? '<td>' + esc(l.commodityCode || '') + '</td>' : '') + '<td class="r">' + esc(String(l.q)) + '</td>' + (showUnit ? '<td>' + esc(l.unitTxt) + '</td>' : '') +
      '<td class="r">' + money(l.rateN) + '</td>' + (showDisc ? '<td class="r">' + (l.discN > 0 ? '-' + money(l.discN) : '') + '</td>' : '') +

  h += box('Section D · Goods and services', t);

  // Tax + summary
  const tr = taxRows();
  let tx = '<table class="tax-t"><thead><tr><th>Tax category</th><th class="r">Net amount</th><th class="r">Tax</th><th class="r">Gross</th></tr></thead><tbody>' +
    tr.map(r => '<tr><td>' + esc(r.label) + '</td><td class="r">' + money(r.net) + '</td><td class="r">' + money(r.vat) + '</td><td class="r">' + money(r.gross) + '</td></tr>').join('') + '</tbody></table>';
  let sm = '<div class="sum"><div class="ln"><span>Net amount</span><span>' + money(NET) + '</span></div><div class="ln"><span>Tax amount</span><span>' + money(VAT) + '</span></div>' +

  h += '<div style="display:grid;grid-template-columns:' + sumCol + ';gap:12px;align-items:start;">' +

  if ((KIND === 'invoice' || BAL > 0.005) && KIND !== 'credit') {

    if (pd.momo) pdl.push(['Mobile money', pd.momo]); if (pd.terms || D.payTerms) pdl.push(['Terms', pd.terms || D.payTerms]);
    if (pdl.length) h += box('How to pay', kv(pdl));
  }

  if (S.signatures) {

  }

  if (FISCAL) {

      'Scan the QR code or enter the FDN and verification code at efris.ura.go.ug.<br>' +

  }
  if (P.footer) h += '<div class="msg">' + esc(P.footer) + '</div>';
  if (FISCAL) h += '<div class="end" style="font-weight:700;letter-spacing:.04em;justify-content:center;border-top:0;"><span>' + esc(endLine()) + '</span></div>';
  h += '<div class="end"><span>' + esc(genStamp()) + ' · ' + esc(printMark()) + '</span></div>';

  if (showCopy()) h += '<div class="wm"><span>COPY</span></div>';

/* ══ Clean layout ══ */
// The band colour mixed into white, for the total's light background (a plain hex
// colour: the PDF renderer does not understand color-mix()).
function tint(hex, a) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#f1f5f2';
  const n = parseInt(m[1], 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(255 - (255 - v) * a));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
function refLabel() { return KIND === 'invoice' ? 'Invoice no.' : KIND === 'credit' ? 'Credit note no.' : KIND === 'debit' ? 'Debit note no.' : 'Receipt no.'; }
function payStatus() { return { paid: ['PAID IN FULL', 'cl-st-paid'], part: ['PART PAID', 'cl-st-part'], unpaid: ['UNPAID', 'cl-st-unpaid'] }[PAYSTATE] || null; }
function payLabels() { return PAYS.map(p => p.label).join(' + '); }
const PAID_BY = () => PAYS.filter(p => !/credit/i.test(p.label));
// Item codes under the name: own code, URA commodity code, tax category, description.
function itemSub(l, S, short) {
  const s = [];
  if (S.itemCodes && l.itemCode && l.itemCode !== l.commodityCode) s.push('<span class="mono">' + esc(l.itemCode) + '</span>');
  if (S.uraCode && l.commodityCode) s.push('URA <span class="mono">' + esc(l.commodityCode) + '</span>');
  s.push((short ? '' : 'Tax ') + l.cat);
  if (l.desc && !short) s.push(esc(l.desc));
  return s.join(' · ');
}
function ckv(rows) { return '<div class="cl-kv">' + rows.filter(Boolean).map(r => '<span class="k">' + esc(r[0]) + '</span><span class="v ' + (r[2] || '') + '">' + (r[3] ? r[1] : esc(r[1] == null || r[1] === '' ? '-' : r[1])) + '</span>').join('') + '</div>'; }
function howToPayRows() {
  const pd = P.pay, r = [];
  if ((KIND === 'invoice' || BAL > 0.005) && KIND !== 'credit') {
    if (pd.bank) r.push(['Bank', pd.bank]); if (pd.accName) r.push(['Account name', pd.accName]); if (pd.accNo) r.push(['Account no.', pd.accNo, 'mono']);
    if (pd.momo) r.push(['Mobile money', pd.momo]); if (pd.terms || D.payTerms) r.push(['Terms', pd.terms || D.payTerms]);
  }
  return r;
}
function sandboxNote() { return D.mode === 'sandbox' ? 'SANDBOX · NOT A LIVE DOCUMENT' : ''; }

function srow(k, v) { return '<div class="sl-row"><span>' + esc(k) + '</span><span class="sl-wrap">' + esc(v || '') + '</span></div>'; }
function box(title, body) { return '<div class="box"><div class="box-h">' + esc(title) + '</div>' + body + '</div>'; }
function kv(rows) { return '<div class="kv">' + rows.filter(Boolean).map(r => '<div class="k">' + esc(r[0]) + '</div><div class="v ' + (r[2] || '') + '">' + esc(r[1] == null || r[1] === '' ? '-' : r[1]) + '</div>').join('') + '</div>'; }
function genStamp() { try { return 'Printed ' + new Date().toLocaleString('en-UG', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (_) { return ''; } }

/* ══ Reprints (URS 9.10): the first print is the ORIGINAL, every later one a COPY ══
   The count lives on the relay (per business and FDN, or reference), so a reprint
   on another computer is still a COPY. Only when the relay cannot be reached does
   the page fall back to this browser's own counter (and the copy=1 hint). */
const PRINT_KEY = D.fdn || D.ref || '';
const PKEY = 'efris_prints_' + (PRINT_KEY || 'doc');
let RCOUNT = null;                  // relay print count; null = not known (offline / no bridge)
function localCount() { try { return parseInt(localStorage.getItem(PKEY) || '0', 10) || 0; } catch (_) { return 0; } }
function printCount() { return RCOUNT != null ? RCOUNT : localCount(); }
function showCopy() { return RCOUNT != null ? RCOUNT > 0 : (D.copy || localCount() > 0); }
function printMark() { const n = printCount(); return showCopy() ? 'COPY' + (n > 0 ? ' ' + n : '') : 'ORIGINAL'; }

/* ══ Toolbar ══ */
function renderToolbar() {
  const f = el('chFiscal');
  if (FISCAL) { f.className = 'chip ok'; f.textContent = 'Fiscalised · FDN ' + D.fdn; }
  else if (D.queued) { f.className = 'chip warn'; f.textContent = 'Queued offline'; }
  else { f.className = 'chip bad'; f.textContent = 'Not fiscalised'; }
  const m = el('chMode');
  if (D.mode) { m.style.display = ''; m.className = 'chip ' + (D.mode === 'sandbox' ? 'warn' : 'info'); m.textContent = D.mode === 'sandbox' ? 'Sandbox' : 'Live'; } else m.style.display = 'none';
  const p = el('chPay');
  if (PAYSTATE) { p.style.display = ''; p.className = 'chip ' + (PAYSTATE === 'paid' ? 'ok' : PAYSTATE === 'part' ? 'warn' : 'plain'); p.textContent = PAYSTATE === 'paid' ? 'Paid' : PAYSTATE === 'part' ? 'Part-paid · balance ' + money(BAL) : 'Unpaid · ' + money(BAL) + ' due'; } else p.style.display = 'none';
  el('tbDoc').textContent = docTitle() + ' ' + (D.ref || '') + ' · ' + CUR + ' ' + money(GROSS) + (printCount() ? ' · printed ' + printCount() + '×' : '');
  const v = el('btnVerify');
  if (FISCAL && /^https:\/\//i.test(D.validationUrl)) { v.style.display = ''; v.href = D.validationUrl; } else v.style.display = 'none';
  const b = el('btnMgr');
  if (D.inMgr) { b.style.display = ''; b.className = 'tbtn done'; b.textContent = 'In Manager ✓' + (D.mgrRef ? ' ' + D.mgrRef : ''); b.disabled = true; }
  else if (MGR_CAN) { b.style.display = ''; b.className = 'tbtn'; b.textContent = 'Save to Manager'; b.disabled = false; }
  else b.style.display = 'none';
}
function note(msg, err) { const n = el('tbNote'); n.textContent = msg || ''; n.className = err ? 'err' : ''; n.style.display = msg ? 'block' : 'none'; }

function doPrint() {
  window.print();
}
/* One sheet when it nearly fits: scale the page down (not below 75%) for printing;
   Save PDF applies the same rule in vectorPdf(). Longer documents still paginate. */
const PAGE_MM = { A4: [210, 297, 10], Letter: [215.9, 279.4, 10], A5: [148, 210, 7], A6: [105, 148, 4] };
function fitScale() {
  const z = PAGE_MM[PAPER], sh = el('sheet'); if (!z) return 1;
  const f = ((z[1] - 2 * z[2]) / (z[0] - 2 * z[2])) * sh.offsetWidth / sh.scrollHeight;
  return f < 1 && f >= 0.75 ? f : 1;
}
window.addEventListener('beforeprint', () => {
  const z = PAGE_MM[PAPER], sh = el('sheet'); sh.style.zoom = '';   // drop the on-screen fit
  if (!z) return;
  // Zoom so the sheet is exactly the printable width (no browser shrink-to-fit), times the fit.
  sh.style.zoom = String(((z[0] - 2 * z[2]) / 25.4 * 96) / sh.offsetWidth * fitScale() * 0.995);
});
window.addEventListener('afterprint', () => { fitScreen(); });
window.addEventListener('afterprint', () => {
  try { localStorage.setItem(PKEY, String(localCount() + 1)); } catch (_) {}
  if (BRIDGE && PRINT_KEY) { if (RCOUNT != null) RCOUNT++; send({ action: 'print-count-add', key: PRINT_KEY, ref: D.ref }); }
  render();
});

function saveToManager() {
  const b = el('btnMgr'); if (!BRIDGE || D.inMgr) return;
  b.disabled = true; b.textContent = 'Saving…';
  _pending.save = r => {
    if (r.ok) { D.inMgr = true; D.mgrRef = r.ref || D.ref; note(r.existing ? 'Already in Manager: the receipt was not created twice.' : 'Saved to Manager as ' + (r.ref || D.ref) + '.'); }
    else { note('Could not save to Manager: ' + (r.error || 'unknown error'), true); }
    renderToolbar();
  };
  send({ action: 'save-to-manager' });
  setTimeout(() => { if (_pending.save) { delete _pending.save; note('Manager did not answer. Check the Manager connection and try again.', true); renderToolbar(); } }, 30000);
}

async function savePdf() {
  const sh = el('sheet');
  if (typeof html2pdf === 'undefined') { note('The PDF engine did not load, so the Print dialog opens instead (choose Save as PDF there).', true); window.print(); return; }
  const safe = s => String(s || '').replace(/[^A-Za-z0-9-]+/g, '_').replace(/^_+|_+$/g, '');
  const fname = (safe(D.ref) || safe(D.docType) || 'Document') + (D.fdn ? '_' + safe(D.fdn) : '') + '.pdf';
  const b = el('btnPdf'); b.disabled = true; b.textContent = 'Saving…';
  sh.style.zoom = '';   // measure the sheet at its real size, not the on-screen fit
  try {
    const pdf = await vectorPdf(sh);
    pdf.save(fname);
    note('Saved ' + fname + '.');
  } catch (e) {
    note('Could not build the PDF (' + (e && e.message || e) + '). The Print dialog opens instead.', true); window.print();
  } finally { b.disabled = false; b.textContent = 'Save PDF'; fitScreen(); }
}

/* ══ Save PDF as real text ══
   Draws the rendered sheet into the PDF as text, lines, fills and images (not a
   screenshot), so the text is sharp at any zoom, searchable, and a one-page
   document is tens of KB. Every word is placed where the browser laid it out;
   the sheet uses Arial / Courier New, whose widths match Helvetica / Courier. */
async function vectorPdf(sh) {
  // html2pdf bundles jsPDF but does not export it: borrow an instance from a tiny job.
  const tmp = document.createElement('div'); tmp.style.cssText = 'width:1px;height:1px;position:absolute;left:-9999px'; document.body.appendChild(tmp);
  let pdf;
  try { pdf = await html2pdf().set({ margin: 0, jsPDF: { unit: 'pt', format: 'a4' } }).from(tmp).toPdf().get('pdf'); } finally { tmp.remove(); }

  const slip = PAPER === '80mm' || PAPER === '58mm';
  const PT = 72 / 25.4;   // points per mm
  const sz = { A4: [210, 297, 10], Letter: [215.9, 279.4, 10], A5: [148, 210, 7], A6: [105, 148, 4] };
  const W0 = sh.offsetWidth, H0 = sh.scrollHeight, base = sh.getBoundingClientRect();
  let pw, ph, m, k;
  if (slip) { pw = (PAPER === '58mm' ? 58 : 80) * PT; k = pw / W0; m = 0; ph = H0 * k + 4; }
  else { const z = sz[PAPER] || sz.A4; pw = z[0] * PT; ph = z[1] * PT; m = z[2] * PT; k = (pw - 2 * m) / W0 * fitScale(); }
  const mx = slip ? 0 : m + ((pw - 2 * m) - W0 * k) / 2;   // centred when scaled to fit
  pdf.addPage([pw, ph], 'portrait'); pdf.deletePage(1);

  // Page breaks between top-level blocks, never through one (a block taller than a page is clamped).
  const usable = slip ? Infinity : (ph - 2 * m) / k, starts = [0];
  [...sh.children].forEach(c => {
    const r = c.getBoundingClientRect(), top = r.top - base.top, bot = r.bottom - base.top, s0 = starts[starts.length - 1];
    if (bot - s0 > usable && top > s0) starts.push(top);
  });
  for (let i = 1; i < starts.length; i++) pdf.addPage([pw, ph], 'portrait');
  const pageOf = y => { let p = 0; while (p + 1 < starts.length && y >= starts[p + 1] - 0.5) p++; return p; };
  const X = x => mx + (x - base.left) * k;
  const at = (yAbs) => { const p = pageOf(yAbs); pdf.setPage(p + 1); return y => m + (y - starts[p]) * k; };

  const rgb = c => { const v = String(c).match(/[\d.]+/g); if (!v) return null; const a = v.length > 3 ? +v[3] : 1; if (a === 0) return null;
    return [0, 1, 2].map(i => Math.round(255 - (255 - +v[i]) * a)); };   // blend any alpha onto white paper
  const imgData = async img => {
    if (/^data:image\/(png|jpe?g)/i.test(img.src)) return img.src;
    try { const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext('2d').drawImage(img, 0, 0); return c.toDataURL('image/png'); } catch (_) { return null; }
  };
  // Characters outside the PDF's built-in WinAnsi set are swapped for close equivalents.
  const ansi = t => t.replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/…/g, '...').replace(/✓|✔/g, 'v')
    .replace(/[^\x20-\x7E -ÿ–—•€]/g, '');

  const els = [sh, ...sh.querySelectorAll('*')];
  for (const e of els) {
    const cs = getComputedStyle(e);
    if (cs.display === 'none' || cs.visibility === 'hidden') continue;
    const r = e.getBoundingClientRect(); if (!r.width && !r.height) continue;
    if (e.closest('.wm')) continue;   // COPY watermark is drawn last
    const Y = at(r.top - base.top), x = X(r.left), y = Y(r.top - base.top), w = r.width * k, h = r.height * k;
    const bg = e !== sh && rgb(cs.backgroundColor);
    if (bg) { pdf.setFillColor(...bg); pdf.rect(x, y, w, h, 'F'); }
    // Borders: solid, dashed or double, per side.
    [['Top', x, y, x + w, y], ['Bottom', x, y + h, x + w, y + h], ['Left', x, y, x, y + h], ['Right', x + w, y, x + w, y + h]].forEach(([s, x1, y1, x2, y2]) => {
      const bw = parseFloat(cs['border' + s + 'Width']) || 0, st = cs['border' + s + 'Style'];
      if (!bw || st === 'none' || st === 'hidden') return;
      const col = rgb(cs['border' + s + 'Color']) || [0, 0, 0]; pdf.setDrawColor(...col);
      const horiz = y1 === y2, inset = bw * k / 2, sign = (s === 'Bottom' || s === 'Right') ? -1 : 1;
      const ln = off => { if (horiz) pdf.line(x1, y1 + off, x2, y2 + off); else pdf.line(x1 + off, y1, x2 + off, y2); };
      pdf.setLineDashPattern(st === 'dashed' ? [3 * k, 2 * k] : [], 0);
      if (st === 'double' && bw >= 3) { pdf.setLineWidth(bw * k / 3); ln(sign * bw * k / 6); ln(sign * bw * k * 5 / 6); }
      else { pdf.setLineWidth(bw * k); ln(sign * inset); }
    });
    pdf.setLineDashPattern([], 0);
    if (e.tagName === 'IMG' && e.complete && e.naturalWidth) {
      const d = await imgData(e);
      if (d) { const fit = cs.objectFit === 'contain' ? Math.min(r.width / e.naturalWidth, r.height / e.naturalHeight) : 0;
        const iw = fit ? e.naturalWidth * fit * k : w, ih = fit ? e.naturalHeight * fit * k : h;
        pdf.addImage(d, /jpe?g/i.test(d.slice(0, 20)) ? 'JPEG' : 'PNG', x + (w - iw) / 2, y + (h - ih) / 2, iw, ih); }
    }
    // Text: one word at a time, at the browser's own position.
    for (const n of e.childNodes) {
      if (n.nodeType !== 3 || !n.nodeValue.trim()) continue;
      const fs = parseFloat(cs.fontSize), bold = (parseInt(cs.fontWeight, 10) || 400) >= 600;
      const mono = /courier|mono|consol/i.test(cs.fontFamily), italic = cs.fontStyle === 'italic';
      pdf.setFont(mono ? 'courier' : 'helvetica', bold ? (italic ? 'bolditalic' : 'bold') : (italic ? 'italic' : 'normal'));
      pdf.setFontSize(fs * k); pdf.setTextColor(...(rgb(cs.color) || [0, 0, 0]));
      const ls = parseFloat(cs.letterSpacing) || 0; pdf.setCharSpace(ls * k);
      const up = cs.textTransform === 'uppercase', rx = /\S+/g, txt = n.nodeValue, rg = document.createRange(); let mt;
      while ((mt = rx.exec(txt))) {
        rg.setStart(n, mt.index); rg.setEnd(n, mt.index + mt[0].length);
        const rr = rg.getClientRects()[0]; if (!rr || !rr.width) continue;
        const word = ansi(up ? mt[0].toUpperCase() : mt[0]); if (!word) continue;
        const Yw = at(rr.top - base.top);
        // Arial: ascent 0.905em, descent 0.212em; centre that box in the line rect for the baseline.
        const baseY = rr.top - base.top + (rr.height - 1.117 * fs) / 2 + 0.905 * fs;
        pdf.text(word, X(rr.left), Yw(baseY));
      }
      pdf.setCharSpace(0);
    }
  }
  // COPY watermark, light grey, rotated like the preview, centred on each page.
  const wm = sh.querySelector('.wm span');
  if (wm) {
    const cs = getComputedStyle(wm), fs = parseFloat(cs.fontSize) * k;
    for (let p = 1; p <= starts.length; p++) {
      pdf.setPage(p); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(fs); pdf.setTextColor(...(rgb(cs.color) || [235, 235, 235]));
      pdf.setCharSpace((parseFloat(cs.letterSpacing) || 0) * k);
      const tw = pdf.getTextWidth('COPY'), a = 30 * Math.PI / 180, cx = pw / 2, cy = slip ? ph / 2 : ph / 2;
      pdf.text('COPY', cx - Math.cos(a) * tw / 2 - Math.sin(a) * fs * 0.35, cy + Math.sin(a) * tw / 2 - Math.cos(a) * fs * 0.35 + fs * 0.35, { angle: 30 });
      pdf.setCharSpace(0);
    }
  }
  pdf.setPage(1);
  return pdf;
}

/* ══ Customize ══ */
// Opened from Settings to adjust the document look: show a SAMPLE notice and the panel.
if (qp('cz') === '1') setTimeout(() => { try { if (!el('cz').classList.contains('open')) toggleCz(); if (qp('sample') === '1') note('Sample document: change the settings and see them here. They apply to your receipts, invoices and credit notes. Nothing is sent to URA or Manager.'); } catch (_) {} }, 300);
function toggleCz() { const c = el('cz'), open = !c.classList.contains('open'); c.classList.toggle('open', open); el('btnCz').setAttribute('aria-expanded', open); if (open) syncCz(); }
function czSet(k, v) { P[k] = v; savePrefs(); render(); }
// Custom band colour: the picker and the #hex box stay in step; any 6-digit hex is accepted.
function czBandCustom(v, live) { if (!/^#[0-9a-f]{6}$/i.test(v)) return; P.band = v.toLowerCase(); const hx = el('czBandHex'); if (hx && hx !== document.activeElement) hx.value = P.band; savePrefs(); render();
  el('czBands').querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === P.band));
  const cc = el('czBands').querySelector('.czCustom'); if (cc) cc.classList.toggle('on', !BANDS.some(b => b[0] === P.band));
  if (!live) syncCz(); }
function czBandHex(v) { v = v.trim(); if (v && v[0] !== '#') v = '#' + v; if (/^#[0-9a-f]{6}$/i.test(v)) { const pk = el('czBandPick'); if (pk) pk.value = v.toLowerCase(); czBandCustom(v, 1); } }
function czSetH(k, v) { P.header[k] = v; savePrefs(); render(); }
// Any logo as pure black and white: thermal printers print one colour, and a grey or
// colour logo comes out as a muddy patch. Everything that is not background becomes
// black: dark pixels, and coloured ones however light (a red or green ring stays);
// near-white and transparent areas become white. Made once per logo, in the
// background; the document draws again when it is ready.
const _mono = {};
function monoLogo(src) {
  if (_mono[src]) return _mono[src] === 1 ? '' : _mono[src];
  _mono[src] = 1;
  const im = new Image();
  im.onload = () => {
    try {
      const k = Math.min(1, 360 / Math.max(im.width, im.height));
      const w = Math.max(1, Math.round(im.width * k)), h = Math.max(1, Math.round(im.height * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.drawImage(im, 0, 0, w, h);
      const d = g.getImageData(0, 0, w, h), px = d.data;
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i], gg = px[i + 1], b = px[i + 2];
        const lum = 0.299 * r + 0.587 * gg + 0.114 * b;
        const mx = Math.max(r, gg, b), sat = mx ? (mx - Math.min(r, gg, b)) / mx : 0;
        const ink = px[i + 3] > 127 && (lum < 190 || sat > 0.3);
        px[i] = px[i + 1] = px[i + 2] = ink ? 0 : 255; px[i + 3] = ink ? 255 : 0;
      }
      g.putImageData(d, 0, 0);
      _mono[src] = c.toDataURL('image/png');
      render();
    } catch (_) { _mono[src] = 1; }
  };
  im.onerror = () => { _mono[src] = 1; };
  im.src = src;
  return '';
}
function czSetP(k, v) { P.pay[k] = v; savePrefs(); render(); }
function czSetS(k, v) { P.show[k] = v; savePrefs(); render(); }
function czSetPaper(kind, v) { P.paper[kind] = v; savePrefs(); }
function czLogoPick(inp) {
  const f = inp.files && inp.files[0]; inp.value = '';
  if (!f) return;
  if (!/^image\/(png|jpeg)$/.test(f.type)) { note('Use a PNG or JPG image for the logo.', true); return; }
  if (f.size > 300 * 1024) { note('That logo is larger than 300 KB. Use a smaller image.', true); return; }
  const r = new FileReader();
  r.onload = () => { P.logo = String(r.result || ''); P.showLogo = true; savePrefs(); syncCz(); render(); note('Logo saved for this business.'); };
  r.readAsDataURL(f);
}
function czLogoClear() { P.logo = ''; savePrefs(); syncCz(); render(); }
function syncCz() {
  const lg = safeImg(P.logo || D.logoUrl);
  el('czLogoPrev').innerHTML = lg ? '<img alt="Logo" src="' + lg + '"/>' : 'LOGO';
  el('czShowLogo').checked = !!P.showLogo;
  el('czLogoMono').checked = !!P.logoMono;
  el('czSlipLogo').checked = P.slipLogo !== false;
  el('czNameMode').value = P.nameMode;
  el('czLayout').value = P.layout === 'classic' ? 'classic' : 'clean';
  el('czBands').innerHTML = BANDS.map(b => '<button type="button" class="sw' + (P.band === b[0] ? ' on' : '') + '" style="background:' + b[0] + '" aria-label="' + esc(b[1]) + '" data-c="' + b[0] + '"></button>').join('') +
    '<span class="czCustom' + (BANDS.some(b => b[0] === P.band) ? '' : ' on') + '" title="Custom colour"><input type="color" id="czBandPick" aria-label="Pick a custom colour" value="' + esc(P.band) + '" oninput="czBandCustom(this.value,1)" onchange="czBandCustom(this.value)"/>' +
    '<input type="text" id="czBandHex" aria-label="Custom colour code" maxlength="7" spellcheck="false" placeholder="#1f2937" value="' + esc(P.band) + '" oninput="czBandHex(this.value)"/></span>';
  el('czBands').querySelectorAll('button').forEach(b => b.onclick = () => { czSet('band', b.dataset.c); syncCz(); });
  const h = P.header;
  el('czHAddr').checked = h.address; el('czHPhone').checked = h.phone; el('czHEmail').checked = h.email; el('czHWeb').checked = h.website; el('czHBox').checked = h.pobox;
  el('czWebTxt').value = h.websiteText || ''; el('czBoxTxt').value = h.poboxText || ''; el('czFooter').value = P.footer || '';
  const pd = P.pay; el('czBank').value = pd.bank || ''; el('czAccName').value = pd.accName || ''; el('czAccNo').value = pd.accNo || ''; el('czMomo').value = pd.momo || ''; el('czTerms').value = pd.terms || '';
  const s = P.show; el('czSCodes').checked = s.itemCodes; el('czSUra').checked = s.uraCode; el('czSUnit').checked = s.unit; el('czSDisc').checked = s.discount; el('czSServed').checked = s.servedBy; el('czSSig').checked = s.signatures; el('czSNotes').checked = s.notes;
  [['czPRec', 'receipt'], ['czPInv', 'invoice'], ['czPCn', 'credit']].forEach(([id, k]) => { el(id).innerHTML = PAPERS.map(p => '<option' + (P.paper[k] === p ? ' selected' : '') + '>' + p + '</option>').join(''); });
}

/* ══ Init ══ */
el('paperSel').innerHTML = PAPERS.map(p => '<button type="button" data-p="' + p + '">' + p + '</button>').join('');
el('paperSel').querySelectorAll('button').forEach(b => b.onclick = () => pickPaper(b.dataset.p));
(function init() {
  const local = loadLocal(); if (local) P = merge(DEF, local);
  applyPaper(choosePaper()); render();
  if (parent && parent !== window) send({ action: 'get-context', fdn: D.fdn, ref: D.ref });
  // "Print straight away" (Settings): open the Print dialog once the page has laid out.
  if (qp('autoprint') === '1') setTimeout(doPrint, 700);
})();
